# Utilitário temporário: baixa a logo da marca do Google Drive, converte para
# uma versão leve (até 512 px, o menor arquivo entre PNG/PNG-256/JPG) e devolve
# o arquivo em pedaços pelo canal de anotações do job — este ambiente não
# alcança log nem artefato, mas lê anotações pela API do GitHub.
#
# Limites do canal: 4096 caracteres por anotação, 10 anotações por check-run,
# por isso o trabalho é dividido em três jobs.
name: Buscar logo da marca

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/buscar-logo.yml'

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar a logo e preparar a versão leve
        env:
          LOGO_URL: https://drive.google.com/file/d/1aTPegfG2Vv1SNmGTrG2TvluNctSLMSIp/view?usp=sharing
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 .github/buscar-logo.py
          mkdir -p dados-logo
          cp /tmp/b64.txt /tmp/previa.txt /tmp/pedacos.txt dados-logo/
          sha256sum public/marca/logo.png | cut -c1-16 > dados-logo/hash.txt
          wc -l dados-logo/b64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: logo-dados
          path: dados-logo

  pedacos-a:
    needs: preparar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: logo-dados
          path: dados-logo
      - name: Resumo e pedaços 1 a 9
        run: |
          echo "::notice title=logo-resumo::pedacos=$(cat dados-logo/pedacos.txt) | sha256-16=$(cat dados-logo/hash.txt)"
          i=0
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '1,9p' dados-logo/b64.txt)

  pedacos-b:
    needs: preparar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: logo-dados
          path: dados-logo
      - name: Pedaços 10 a 19
        run: |
          i=9
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '10,19p' dados-logo/b64.txt)

  pedacos-c:
    needs: preparar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: logo-dados
          path: dados-logo
      - name: Pedaços 20 a 29 e miniatura
        run: |
          i=19
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '20,29p' dados-logo/b64.txt)
          j=0
          while read -r linha; do
            j=$((j + 1))
            echo "::notice title=logo-preview-$(printf '%02d' $j)::${linha}"
          done < dados-logo/previa.txt
