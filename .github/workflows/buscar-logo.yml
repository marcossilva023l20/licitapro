# Utilitário temporário: baixa a logo da marca do Google Drive, converte para
# uma versão leve (512 px, o menor arquivo entre PNG/PNG-256/JPG) e devolve o
# arquivo em pedaços pelo canal de anotações do job — este ambiente não alcança
# log nem artefato, mas lê anotações pela API.
#
# Limites do canal: 4096 caracteres por anotação, 10 anotações por passo.
#
# Roda quando este arquivo muda (ou manualmente, em "Actions").
name: Buscar logo da marca

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/buscar-logo.yml'

permissions:
  contents: read

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a logo do Google Drive e preparar a versão leve
        env:
          LOGO_URL: https://drive.google.com/file/d/1aTPegfG2Vv1SNmGTrG2TvluNctSLMSIp/view?usp=sharing
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 - <<'PYFIM'

import base64, hashlib, io, os, re, sys, textwrap, urllib.request
from PIL import Image

url = os.environ["LOGO_URL"]
achado = re.search(r"/d/([A-Za-z0-9_-]{15,})", url) or re.search(r"[?&]id=([A-Za-z0-9_-]{15,})", url)
fid = achado.group(1) if achado else None
print("ID do arquivo:", fid)

candidatos = []
if fid:
    candidatos += [
        "https://drive.usercontent.google.com/download?id=%s&export=download&confirm=t" % fid,
        "https://drive.google.com/uc?export=download&id=%s" % fid,
        "https://docs.google.com/uc?export=download&id=%s" % fid,
        "https://drive.google.com/uc?id=%s&export=png" % fid,
        "https://lh3.googleusercontent.com/d/%s=w2400" % fid,
        "https://lh3.googleusercontent.com/d/%s" % fid,
    ]
candidatos.append(url)

def eh_imagem(dados):
    return dados[:8] == b"\x89PNG\r\n\x1a\n" or dados[:3] == b"\xff\xd8\xff" or dados[:4] == b"RIFF"

dados = None
for c in candidatos:
    try:
        pedido = urllib.request.Request(c, headers={"User-Agent": "Mozilla/5.0 (github-actions)"})
        with urllib.request.urlopen(pedido, timeout=60) as resposta:
            corpo = resposta.read()
        print("tentativa %s -> %d bytes, inicio %r" % (c[:90], len(corpo), corpo[:8]))
        if eh_imagem(corpo):
            dados = corpo
            break
        print("  resposta nao e imagem")
    except Exception as erro:
        print("tentativa %s falhou: %s" % (c[:90], erro))

if dados is None:
    print("NAO_FOI_POSSIVEL_BAIXAR")
    sys.exit(1)

original = Image.open(io.BytesIO(dados))
original.load()
print("origem: %s %s %s" % (original.format, original.size, original.mode))

alfa = original.mode in ("RGBA", "LA") or "transparency" in original.info
base = original.convert("RGBA") if alfa else original.convert("RGB")
if max(base.size) > 512:
    fator = 512 / max(base.size)
    base = base.resize((max(1, round(base.width * fator)), max(1, round(base.height * fator))), Image.LANCZOS)

variantes = {}
b = io.BytesIO(); base.save(b, "PNG", optimize=True); variantes["png"] = b.getvalue()
if alfa:
    try:
        q = base.convert("RGBA").quantize(colors=256, method=Image.FASTOCTREE)
        b = io.BytesIO(); q.save(b, "PNG", optimize=True); variantes["png256"] = b.getvalue()
    except Exception as erro:
        print("quantizacao falhou:", erro)
else:
    b = io.BytesIO(); base.save(b, "JPEG", quality=88, optimize=True, progressive=True); variantes["jpg"] = b.getvalue()
    try:
        q = base.convert("P", palette=Image.ADAPTIVE, colors=256)
        b = io.BytesIO(); q.save(b, "PNG", optimize=True); variantes["png256"] = b.getvalue()
    except Exception as erro:
        print("quantizacao falhou:", erro)

nome, escolhido = min(variantes.items(), key=lambda par: len(par[1]))
print("tamanhos:", {k: len(v) for k, v in variantes.items()})
print("escolhido: %s %d bytes | %s" % (nome, len(escolhido), base.size))
print("sha256:", hashlib.sha256(escolhido).hexdigest())

os.makedirs("public/marca", exist_ok=True)
aberto = open("public/marca/logo.png", "wb")
aberto.write(escolhido)
aberto.close()

texto = base64.b64encode(escolhido).decode()
with open("/tmp/b64.txt", "w", encoding="utf-8") as arquivo:
    arquivo.write("\n".join(textwrap.wrap(texto, 3900)))
with open("/tmp/pedacos.txt", "w", encoding="utf-8") as arquivo:
    arquivo.write(str(len(textwrap.wrap(texto, 3900))))

menor = base.copy()
fator = 200 / max(menor.size)
menor = menor.resize((max(1, round(menor.width * fator)), max(1, round(menor.height * fator))), Image.LANCZOS)
p = io.BytesIO(); menor.convert("RGB").save(p, "JPEG", quality=75, optimize=True)
previa = base64.b64encode(p.getvalue()).decode()
with open("/tmp/previa.txt", "w", encoding="utf-8") as arquivo:
    arquivo.write("\n".join(textwrap.wrap(previa, 3900)))
print("previa:", len(p.getvalue()), "bytes")
          PYFIM
      - name: Informar o tamanho
        run: echo "::notice title=logo-resumo::pedacos=$(cat /tmp/pedacos.txt) | $(sha256sum public/marca/logo.png | cut -c1-16)"
      - name: Pedaços 1 a 10
        run: |
          i=0
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '1,10p' /tmp/b64.txt)
      - name: Pedaços 11 a 20
        run: |
          i=10
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '11,20p' /tmp/b64.txt)
      - name: Pedaços 21 a 30
        run: |
