# Utilitário temporário: baixa a logo da marca do Google Drive, converte para
# uma versão leve (até 512 px, o menor arquivo entre PNG/PNG-256/JPG) e devolve
# o arquivo em pedaços pelo canal de anotações do job — este ambiente não
# alcança log nem artefato, mas lê anotações pela API do GitHub.
#
# Limites do canal: 4096 caracteres por anotação e 10 anotações por passo,
# por isso o arquivo é dividido em linhas de 3900 caracteres.
#
# Roda quando este arquivo muda (ou manualmente, em "Actions").
name: Buscar logo da marca

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/buscar-logo.yml'

permissions:
  contents: read

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a logo e preparar a versão leve
        env:
          LOGO_URL: https://drive.google.com/file/d/1aTPegfG2Vv1SNmGTrG2TvluNctSLMSIp/view?usp=sharing
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 .github/buscar-logo.py

      - name: Informar o tamanho
        run: |
          echo "::notice title=logo-resumo::pedacos=$(cat /tmp/pedacos.txt) | $(sha256sum public/marca/logo.png | cut -c1-16)"
      - name: Pedaços 1 a 10
        run: |
          i=0
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '1,10p' /tmp/b64.txt)
      - name: Pedaços 11 a 20
        run: |
          i=10
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '11,20p' /tmp/b64.txt)
      - name: Pedaços 21 a 30
        run: |
          i=20
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '21,30p' /tmp/b64.txt)
      - name: Pedaços 31 a 40
        run: |
          i=30
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '31,40p' /tmp/b64.txt)
      - name: Pedaços 41 a 50
        run: |
          i=40
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '41,50p' /tmp/b64.txt)
      - name: Pedaços 51 a 60
        run: |
          i=50
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '51,60p' /tmp/b64.txt)
      - name: Pedaços 61 a 70
        run: |
          i=60
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '61,70p' /tmp/b64.txt)
      - name: Pedaços 71 a 80
        run: |
          i=70
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '71,80p' /tmp/b64.txt)
      - name: Pedaços 81 a 90
        run: |
          i=80
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '81,90p' /tmp/b64.txt)
      - name: Pedaços 91 a 100
        run: |
          i=90
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '91,100p' /tmp/b64.txt)
      - name: Pedaços 101 a 110
        run: |
          i=100
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '101,110p' /tmp/b64.txt)
      - name: Pedaços 111 a 120
        run: |
          i=110
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-pedaco-$(printf '%02d' $i)::${linha}"
          done < <(sed -n '111,120p' /tmp/b64.txt)
      - name: Miniatura para conferência
        run: |
          i=0
          while read -r linha; do
            i=$((i + 1))
            echo "::notice title=logo-preview-$(printf '%02d' $i)::${linha}"
          done < /tmp/previa.txt
